name: Deploy the public gate

# Ships the dashboard, its bearer-token proxy and the Cloudflare tunnel to the
# relay box whenever the gate changes. Safe to re-run: the installer is
# idempotent and keeps the password and the token.
#
# The setup code is deliberately not printed here: this log is public, and that
# code claims the dashboard. Read it on the box with `sudo omnivox-gate status`.

on:
  push:
    branches: [main]
    paths:
      - "deploy/oracle-free-tier/gate.mjs"
      - "deploy/oracle-free-tier/omnivox-gate.sh"
      - "deploy/oracle-free-tier/omnivox-mcp.sh"
      - "deploy/oracle-free-tier/probe-tools.sh"
      - "deploy/oracle-free-tier/test-public.sh"
      - "deploy/oracle-free-tier/patch-mio-guard.py"
      - "deploy/oracle-free-tier/test-gate.sh"
      - "deploy/oracle-free-tier/test-gate-browser.mjs"
      - ".github/workflows/deploy-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-gate
  cancel-in-progress: false

jobs:
  # The dashboard only proves itself through the gatekeeper's own suite, and the
  # suite needs no box: a fake MCP server and a throwaway gate on loopback, then
  # headless Chrome driving it. It runs first, so nothing ships unless it holds.
  gate:
    name: Dashboard suite in a browser
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # Puppeteer's own Chrome plus the shared libraries it links against. The
      # runner has no browser image, so this step fails loudly instead of
      # letting the browser checks quietly turn into a skip.
      - name: Install a headless browser
        run: |
          set -euo pipefail
          npm install --no-save --silent puppeteer@24 >/dev/null
          npx puppeteer browsers install chrome >/dev/null
          echo "PUPPETEER_ROOT=$PWD" >> "$GITHUB_ENV"
          PUPPETEER_ROOT=$PWD node deploy/oracle-free-tier/test-gate-browser.mjs --install-deps
          PUPPETEER_ROOT=$PWD node deploy/oracle-free-tier/test-gate-browser.mjs --check

      - name: Run the gate suite
        env:
          GATE_BROWSER: auto
        run: bash deploy/oracle-free-tier/test-gate.sh

  deploy:
    name: Install the gate on the relay VM
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Prepare SSH
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${VM_SSH_KEY:-}" ]; then
            echo "::error::repository secret VM_SSH_KEY is missing"
            exit 1
          fi
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          : > "$HOME/.ssh/known_hosts"

      - name: Ship and install
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail
          opts=(
            -i "$HOME/.ssh/deploy_key"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o ConnectTimeout=20
          )
          ssh "${opts[@]}" "$VM_USER@$VM_HOST" 'install -d -m 755 /tmp/ovx-gate-ship'
          scp -q "${opts[@]}" \
            deploy/oracle-free-tier/gate.mjs \
            deploy/oracle-free-tier/omnivox-gate.sh \
            deploy/oracle-free-tier/probe-tools.sh \
            deploy/oracle-free-tier/test-public.sh \
            deploy/oracle-free-tier/test-gate.sh \
            deploy/oracle-free-tier/test-gate-browser.mjs \
            deploy/oracle-free-tier/omnivox-mcp.sh \
            deploy/oracle-free-tier/patch-download-guard.py \
            deploy/oracle-free-tier/patch-mio-guard.py \
            "$VM_USER@$VM_HOST:/tmp/ovx-gate-ship/"

          # The same suite against the shipped gate, on the box, with the browser
          # this box already has: the dashboard is clicked through for real on
          # every deploy. It uses its own throwaway gate and port, so the token
          # the owner's dashboard shows is never rotated.
          ssh "${opts[@]}" "$VM_USER@$VM_HOST" \
            'sudo -n env PUPPETEER_ROOT=/opt/omnivox-mcp/app GATE_BROWSER=on \
             bash /tmp/ovx-gate-ship/test-gate.sh'

          # The probe is only evidence if it can fail: run its self-test, which
          # breaks a fake server three ways and demands a non-zero exit naming
          # the tool. Nothing is re-applied by hand; this ships with the deploy.
          ssh "${opts[@]}" "$VM_USER@$VM_HOST" \
            'sudo -n bash /tmp/ovx-gate-ship/probe-tools.sh --self-test'

          # Re-fetch the vendored MCP server and re-apply the download guard, so
          # the patch survives an upstream update instead of living in an edited
          # file that the next install would erase.
          ssh "${opts[@]}" "$VM_USER@$VM_HOST" \
            'sudo -n env PATCH_SOURCE=/tmp/ovx-gate-ship/patch-download-guard.py \
             MIO_PATCH_SOURCE=/tmp/ovx-gate-ship/patch-mio-guard.py \
             bash /tmp/ovx-gate-ship/omnivox-mcp.sh update'
          ssh "${opts[@]}" "$VM_USER@$VM_HOST" \
            "sudo -n env GATE_SOURCE=/tmp/ovx-gate-ship/gate.mjs REF=$(git rev-parse HEAD) \
             bash /tmp/ovx-gate-ship/omnivox-gate.sh install"
          # Through the installed command, not the shipped path: this is what
          # SETUP.md tells the operator to run, so the deploy proves it resolves.
          ssh "${opts[@]}" "$VM_USER@$VM_HOST" 'sudo -n omnivox-gate status'
          # Drives the public URL end to end: health, setup redirect, tokenless
          # refusal, then a good and a bogus document download.
          ssh "${opts[@]}" "$VM_USER@$VM_HOST" \
            'sudo -n bash /tmp/ovx-gate-ship/test-public.sh'

          # Every tool against the live account. This runs on the deploy path so
          # a broken tool fails the deploy, not just an on-demand probe nobody
          # looks at. Write tools are only called with impossible ids.
          ssh "${opts[@]}" "$VM_USER@$VM_HOST" \
            'sudo -n bash /tmp/ovx-gate-ship/probe-tools.sh'
