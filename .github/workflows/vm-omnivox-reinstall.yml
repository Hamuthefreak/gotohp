name: Reinstall omnivox on the VM

# Temporary lever, deleted again once it has run. The dispatch API refuses this
# command for now, so the installer is run straight from CI with the same deploy
# secrets. It only triggers on a change to this file.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vm-omnivox-reinstall.yml"

permissions:
  contents: read

jobs:
  reinstall:
    name: Reinstall omnivox-mcp on the relay VM
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${VM_SSH_KEY:-}" ]; then
            echo "::error::repository secret VM_SSH_KEY is missing"
            exit 1
          fi
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          : > "$HOME/.ssh/known_hosts"

      - name: Ship the installer and run it
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail
          opts=(
            -i "$HOME/.ssh/deploy_key"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o ConnectTimeout=20
          )
          ssh "${opts[@]}" "$VM_USER@$VM_HOST" 'cat > /tmp/omnivox-mcp.sh' \
            < deploy/oracle-free-tier/omnivox-mcp.sh
          ssh "${opts[@]}" "$VM_USER@$VM_HOST" \
            'sudo -n bash -lc "install -m 0755 /tmp/omnivox-mcp.sh /usr/local/bin/omnivox-mcp; /usr/local/bin/omnivox-mcp install > /tmp/ox7.log 2>&1; echo RC=\$?; grep -E \"PUPPETEER|healthy|no answer\" /tmp/ox7.log; echo HEALTH; curl -s http://127.0.0.1:3000/health; echo; echo STATE; systemctl is-active omnivox-mcp.service; systemctl is-active gotohp-sync.timer"'
