name: Deploy the public gate

# Ships the dashboard, its bearer-token proxy and the Cloudflare tunnel to the
# relay box whenever the gate changes. Safe to re-run: the installer is
# idempotent and keeps the password and the token.
#
# The setup code is deliberately not printed here: this log is public, and that
# code claims the dashboard. Read it on the box with `sudo omnivox-gate status`.

on:
  push:
    branches: [main]
    paths:
      - "deploy/oracle-free-tier/gate.mjs"
      - "deploy/oracle-free-tier/omnivox-gate.sh"
      - "deploy/oracle-free-tier/omnivox-mcp.sh"
      - "deploy/oracle-free-tier/probe-tools.sh"
      - "deploy/oracle-free-tier/test-public.sh"
      - "deploy/oracle-free-tier/patch-mio-guard.py"
      - "deploy/oracle-free-tier/patch-download-guard.py"
      - "deploy/oracle-free-tier/patch-extra-tools.py"
      - "deploy/oracle-free-tier/test-toolscheck.mjs"
      - "deploy/oracle-free-tier/test-gate.sh"
      - "deploy/oracle-free-tier/test-gate-browser.mjs"
      - ".github/workflows/deploy-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-gate
  cancel-in-progress: false

jobs:
  # The dashboard only proves itself through the gatekeeper's own suite, and the
  # suite needs no box: a fake MCP server and a throwaway gate on loopback, then
  # headless Chrome driving it. It runs first, so nothing ships unless it holds.
  gate:
    name: Dashboard suite in a browser
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # The page checks run against the real gate responses: the shell suite
      # starts a throwaway gate and the page suite reads its pages, its CSP, its
      # session handling and its rotate path over HTTP. No browser is installed
      # here on purpose - a browser's cookie jar and frame lifetime made this job
      # fail on the runner while the gate itself was fine. Clicking the page
      # through still happens on the box, where a browser is installed.
      - name: Run the gate suite
        env:
          GATE_BROWSER: http
        run: bash deploy/oracle-free-tier/test-gate.sh

      - name: The probe and pre-flight suites
        run: |
          set -euo pipefail
          bash deploy/oracle-free-tier/probe-tools.sh --self-test
          npm install --no-save --silent tsx@4 >/dev/null
          TSX_PATH=$PWD/node_modules/.bin/tsx node deploy/oracle-free-tier/test-toolscheck.mjs

  deploy:
    name: Install the gate on the relay VM
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Prepare SSH
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${VM_SSH_KEY:-}" ]; then
            echo "::error::repository secret VM_SSH_KEY is missing"
            exit 1
          fi
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          : > "$HOME/.ssh/known_hosts"

      - name: Ship and install
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail
          opts=(
            -i "$HOME/.ssh/deploy_key"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o ConnectTimeout=20
          )
          ssh "${opts[@]}" "$VM_USER@$VM_HOST" 'install -d -m 755 /tmp/ovx-gate-ship'
          scp -q "${opts[@]}" \
            deploy/oracle-free-tier/gate.mjs \
            deploy/oracle-free-tier/omnivox-gate.sh \
            deploy/oracle-free-tier/probe-tools.sh \
            deploy/oracle-free-tier/test-public.sh \
            deploy/oracle-free-tier/test-gate.sh \
            deploy/oracle-free-tier/test-gate-browser.mjs \
            deploy/oracle-free-tier/omnivox-mcp.sh \
            deploy/oracle-free-tier/patch-download-guard.py \
            deploy/oracle-free-tier/patch-mio-guard.py \
            deploy/oracle-free-tier/patch-extra-tools.py \
            deploy/oracle-free-tier/test-toolscheck.mjs \
            deploy/oracle-free-tier/toolscheck-live.py \
            "$VM_USER@$VM_HOST:/tmp/ovx-gate-ship/"

          # The same suite against the shipped gate, on the box. The box's own
          # Chrome cannot render the gate's page: on this build every
          # navigation to it comes back detached, whichever mode it launches
          # in, while a plain page from a local server renders. So the box runs
          # the page checks over HTTP - the real responses, the shipped CSP,
          # the script and stylesheet, and the session the gate accepts or
          # refuses - and GitHub's runner clicks the same page through in Chrome
          # in the job above. It uses its own throwaway gate and port, so the
          # token the owner's dashboard shows is never rotated.
          ssh "${opts[@]}" "$VM_USER@$VM_HOST" \
            'sudo -n env PUPPETEER_ROOT=/opt/omnivox-mcp/app GATE_BROWSER=http \
             bash /tmp/ovx-gate-ship/test-gate.sh'

          # The tool list a client actually receives, read from outside every
          # script above: the bytes the server answers on /tools, every name, and
          # a second fetch against a closed port so the check is shown to fail.
          # The key is read on the box and passed in the environment only.
          ssh "${opts[@]}" "$VM_USER@$VM_HOST" \
            'KEY=$(sudo -n cat /opt/omnivox-mcp/data/accessKey.txt) sudo -n -E \
               python3 /tmp/ovx-gate-ship/toolscheck-live.py'

          # The probe is only evidence if it can fail: run its self-test, which
          # breaks a fake server three ways and demands a non-zero exit naming
          # the tool. Nothing is re-applied by hand; this ships with the deploy.
          ssh "${opts[@]}" "$VM_USER@$VM_HOST" \
            'sudo -n bash /tmp/ovx-gate-ship/probe-tools.sh --self-test'

          # The tool-load pre-flight is the guard that keeps one broken module
          # from taking the whole server down at startup, so it is proven on the
          # box: a module that throws while loading must be named, a good tree
          # must pass, and a duplicated module must be reported.
          ssh "${opts[@]}" "$VM_USER@$VM_HOST" \
            'sudo -n env TSX_PATH=/opt/omnivox-mcp/app/node_modules/.bin/tsx \
             node /tmp/ovx-gate-ship/test-toolscheck.mjs'

          # Re-fetch the vendored MCP server and re-apply the guards and the
          # extra read tools, so they survive an upstream update instead of
          # living in an edited file that the next install would erase. The step
          # stops the running unit first (a leftover child would answer for the
          # old code), runs every patch from the file this job shipped, and
          # leaves the patch's own output and the unit's journal in the log -
          # a step that only says "exit code 1" cannot be diagnosed.
          ssh "${opts[@]}" "$VM_USER@$VM_HOST" \
            'set -o pipefail; rc=0; sudo -n /bin/bash -c "
               export PATCH_SOURCE=/tmp/ovx-gate-ship/patch-download-guard.py
               export MIO_PATCH_SOURCE=/tmp/ovx-gate-ship/patch-mio-guard.py
               export EXTRA_PATCH_SOURCE=/tmp/ovx-gate-ship/patch-extra-tools.py
               bash /tmp/ovx-gate-ship/omnivox-mcp.sh update
             " 2>&1 | tee /tmp/ovx-update.log || rc=$?
             echo "update exit: $rc"
             if [ $rc -ne 0 ]; then
               echo "::error::the box update failed (exit $rc)"
               sudo -n journalctl -u omnivox-mcp.service -n 40 --no-pager || true
               sudo -n ls -la /opt/omnivox-mcp/app/src/mcp/tools/extra /opt/omnivox-mcp/app/src/index.* || true
             fi
             exit $rc'
          ssh "${opts[@]}" "$VM_USER@$VM_HOST" \
            "sudo -n env GATE_SOURCE=/tmp/ovx-gate-ship/gate.mjs REF=$(git rev-parse HEAD) \
             bash /tmp/ovx-gate-ship/omnivox-gate.sh install"
          # Through the installed command, not the shipped path: this is what
          # SETUP.md tells the operator to run, so the deploy proves it resolves.
          ssh "${opts[@]}" "$VM_USER@$VM_HOST" 'sudo -n omnivox-gate status'
          # The three read tools this deployment adds on top of upstream have to
          # be in the served tool list, or the install silently lost the patch.
          ssh "${opts[@]}" "$VM_USER@$VM_HOST" \
            'for t in get-college-document-link get-mio-message-link get-campus-events get-upcoming-schedule; do
               sudo -n grep -q "\b$t\b" /opt/omnivox-mcp/app/src/mcp/tools/extra/*.ts \
                 || { echo "::error::the extra read tool $t was not installed"; exit 1; }
             done; echo "extra read tools installed"'
          # Drives the public URL end to end: health, setup redirect, tokenless
          # refusal, then a good and a bogus document download.
          ssh "${opts[@]}" "$VM_USER@$VM_HOST" \
            'sudo -n bash /tmp/ovx-gate-ship/test-public.sh'

          # Every tool against the live account. This runs on the deploy path so
          # a broken tool fails the deploy, not just an on-demand probe nobody
          # looks at. Write tools are only called with impossible ids.
          ssh "${opts[@]}" "$VM_USER@$VM_HOST" \
            'sudo -n bash /tmp/ovx-gate-ship/probe-tools.sh'
